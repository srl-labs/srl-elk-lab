@version: 3.38
@include "scl.conf"

options {
    chain-hostnames(no);
    flush-lines(0);
    use-dns(no);
    use-fqdn(no);
    owner("root");
    group("root");
    perm(0644);
    stats_freq(0);
    mark_freq(0);
    log_msg_size(8192);
    keep-hostname(yes);
};

# Receive RFC5424 messages from SRL on UDP port 514
source s_udp_514{
    udp(
        ip(0.0.0.0)
        port(514)
	flags(syslog-protocol, store-raw-message)
    );
};

# Destination for RFC5424 messages
destination d_file {
  file("/var/log/validate.log"
    owner("root")
    group("root")
    perm(0646)
    dir_perm(0755)
    create_dirs(yes)
    template("${RAWMSG}\n"));
};

# For debug / test purposes logs messages in RFC5424 raw format
log {
    source(s_udp_514);
    destination(d_file);
};
