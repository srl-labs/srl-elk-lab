input {
    syslog{
        port => 1514
        use_labels => true
        ecs_compatibility => v1
        id => "srlinux"
        tags => [ "syslog", "srlinux" ]
        timezone => "Europe/Rome"
    }
}

filter {
    if "srlinux" in [tags] {
        grok {
            patterns_dir => [ "/var/lib/logstash/patterns" ]
            # following RFC5424
            match => { "message" => "<%{INT:pri}>%{INT:version}\s+%{TIMESTAMP_ISO8601:timestamp}\s+%{HOSTNAME:hostname}\s+%{WORD:appname}\s+%{DATA:procid}\s+%{DATA:msgid}\s+%{DATA:structured_data}\s+%{SRLPROC:subsystem}\|%{SRLPID:pid}\|%{SRLTHR:thread}\|%{SRLSEQ:sequence}\|%{SRLLVL:initial}:\s+(?<message>.*)" }
            # updating message
            overwrite => [ "message" ]
            # set ECS version ecs.version
            add_field => { "[ecs][version]" => "1.2.0" }
            # syslog PRI => log.syslog.priority - set by input plugin
            # add_field => { "[log][syslog][priority]" => "%{pri}" }
            # version => log.syslog.version
            add_field => { "[log][syslog][version]" => "%{version}" }
            # initial log level => log.level
            add_field => { "[log][level]" => "%{initial}" }
            # subsystem => log.syslog.appname
            add_field => { "[log][syslog][appname]" => "%{subsystem}" }
            # set hostname
            add_field => { "[host][hostname]" => "%{hostname}" }
            # process.name
            add_field => { "[process][name]" => "%{appname}" }
            # process.pid
            add_field => { "[process][pid]" => "%{pid}" }
            # process.thread.id
            add_field => { "[process][thread][id]" => "%{thread}" }
            # event.sequence
            add_field => { "[event][sequence]" => "%{sequence}"}
            # procid => log.syslog.procid - NOT used by SRL 25.3.2
            # add_field => { "[log][syslog][procid]" => "%{procid}" }
            # msgid => log.syslog.msgid - NOT used by SRL 25.3.2
            # add_field => { "[log][syslog][msgid]" => "%{msgid}" }
            # structured_data => log.syslog.structured_data - NOT used by SRL 25.3.2
            # add_field => { "[log][syslog][structured_data]" => "%{structured_data}" }
            
            
            # remove unused fields
            remove_field => [
                "pri", "version",
                "hostname", "appname",
                "procid", "msgid", "structured_data",
                "subsystem", "pid", "thread",
                "sequence", "initial", "timestamp"
            ]
        }

        date {
            match  => [
            "timestamp",
            "ISO8601",
            "yyyy-MM-dd'T'HH:mm:ss.SSSSSSZ" # Example: 2025-07-07T16:02:31.783897+02:00
            ]
            # target => "@timestamp"        # default
            # timezone => "Europe/Rome"     # uncomment only if your stamp had no offset!!!!!
        }
    }
}

output {
    if "srlinux" in [tags] {
        if "_grokparsefailure" in [tags] {
            file {
                path => "/srl/fail_to_parse_srl.log"
                codec => rubydebug
            }
        } else {
            elasticsearch {
                hosts => ["http://elastic:9200"]
                ssl => false
                index => "ecs-logstash-%{+YYYY.MM.dd}"
                manage_template => true
                # template => "/tmp/index-template.json"
                # template_name => "fabric-template"
                # template_overwrite => true
                id => "fabric-logs"
            }
            # stdout outpu added for debug purposes
            # it will emit parsed messages to stdout of the shell
            # users will see those messages with `docker logs -f logstash`
            stdout {}
        }
    }
}
