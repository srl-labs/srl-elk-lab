name: elk
prefix: ""

mgmt:
  network: srl_elk_lab
  ipv4-subnet: 172.22.22.0/24

topology:
  kinds:
    nokia_srlinux:
      image: ghcr.io/nokia/srlinux:25.3.2
      type: ixrd3
      stages:
        create:
          wait-for:
            - node: kibana
              stage: configure
    linux:
      image: ghcr.io/hellt/network-multitool

  nodes:
    #
    # DC FABRIC
    #
    leaf1:
      mgmt-ipv4: 172.22.22.21
      kind: nokia_srlinux
      group: tier-1
      startup-config: fabric/leaf1.cfg
    leaf2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.22.22.22
      group: tier-1
      startup-config: fabric/leaf2.cfg
    leaf3:
      kind: nokia_srlinux
      mgmt-ipv4: 172.22.22.23
      group: tier-1
      startup-config: fabric/leaf3.cfg
    spine1:
      kind: nokia_srlinux
      mgmt-ipv4: 172.22.22.25
      group: tier-2
      startup-config: fabric/spine1.cfg
    spine2:
      kind: nokia_srlinux
      mgmt-ipv4: 172.22.22.26
      group: tier-2
      startup-config: fabric/spine2.cfg
    #
    # ELK STACK
    #
    elastic:
      kind: linux
      mgmt-ipv4: 172.22.22.10
      image: docker.elastic.co/elasticsearch/elasticsearch:8.18.3
      env:
        node.name: elastic
        discovery.type: single-node
        ES_JAVA_OPTS: "-Xms1g -Xmx1g"
      binds:
        - ./elk/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
      ports:
        - 9200:9200/tcp
    logstash:
      kind: linux
      mgmt-ipv4: 172.22.22.11
      image: docker.elastic.co/logstash/logstash:8.18.3
      cmd: --config.reload.automatic
      binds:
        - ./elk/logstash/pipeline/:/usr/share/logstash/pipeline/
        - ./elk/logstash/logstash.yml:/usr/share/logstash/config/logstash.yml
        - ./elk/logstash/patterns:/var/lib/logstash/patterns
        - ./elk/logstash/logs/fail_to_parse_srl.log:/srl/fail_to_parse_srl.log
      stages:
        create:
          wait-for:
            - node: elastic
              stage: configure

    kibana:
      kind: linux
      mgmt-ipv4: 172.22.22.12
      image: docker.elastic.co/kibana/kibana:8.18.3
      binds:
        - ./elk/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml
      ports:
        - 5601:5601/tcp
      stages:
        create:
          wait-for:
           - node: elastic
             stage: configure
    #
    # SYSLOG, for debug and test purposes
    #
    syslog:
      kind: linux
      image: harbor.nice.nokia.net/docker/linuxserver/syslog-ng:4.8.1
      binds:
        - /etc/localtime:/etc/localtime:ro
        - syslog/syslog-ng.conf:/config/syslog-ng.conf
        - logs:/var/log
      env:
        PUID: "0"
        PGID: "0"
      mgmt-ipv4: 172.22.22.41
      restart-policy: unless-stopped
    #
    # CLIENTS
    #
    client1:
      kind: linux
      mgmt-ipv4: 172.22.22.31
      exec:
        - ip link set eth1 down
        - ip addr add 172.16.3.1/24 dev eth1
        - ip link set eth1 up
    client2:
      kind: linux
      mgmt-ipv4: 172.22.22.32
      exec:
        - ip link add bond0 type bond
        - ip link set bond0 type bond miimon 100 mode 802.3ad
        - ip link set bond0 type bond lacp_rate fast
        - ip link set eth1 down
        - ip link set eth2 down
        - ip link set eth1 master bond0
        - ip link set eth2 master bond0
        - ip link set bond0 up
        - ip addr add 172.16.3.2/24 dev bond0
  #
  # LINKS
  #
  links:
    - endpoints:
        - leaf1:e1-1
        - spine1:e1-1
    - endpoints:
        - leaf1:e1-2
        - spine2:e1-1
    - endpoints:
        - leaf2:e1-1
        - spine1:e1-2
    - endpoints:
        - leaf2:e1-2
        - spine2:e1-2
    - endpoints:
        - leaf3:e1-1
        - spine1:e1-3
    - endpoints:
        - leaf3:e1-2
        - spine2:e1-3
    - endpoints:
        - client1:eth1
        - leaf1:e1-10
    - endpoints:
        - client2:eth1
        - leaf2:e1-10
    - endpoints:
        - client2:eth2
        - leaf3:e1-10
